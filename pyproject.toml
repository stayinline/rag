[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-knowledge-base"
version = "0.1.0"
description = "Enterprise RAG Knowledge Base Platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "weaviate-client>=4.0",
    "dashscope>=1.20.0",
    "celery[redis]>=5.4",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",
    "tiktoken>=0.7",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["app", "app.api", "app.api.v1", "app.models", "app.schemas", "app.services", "app.workers", "migrations", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py311"
